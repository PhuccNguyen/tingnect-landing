# =============================================================
# Nginx Reverse Proxy — YaaClub Landing Page
# =============================================================
#
# Setup:
#   1. Thay YOUR_DOMAIN bằng domain thật (ví dụ: yaaclub.com)
#   2. Copy file này lên VPS:
#      scp nginx/yaaclub.conf user@VPS_IP:/tmp/
#   3. Trên VPS:
#      sudo cp /tmp/yaaclub.conf /etc/nginx/sites-available/yaaclub
#      sudo ln -sf /etc/nginx/sites-available/yaaclub /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   4. SSL (sau khi Nginx chạy OK):
#      sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
# =============================================================

upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;  # ← THAY DOMAIN CỦA BẠN

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Next.js Static Assets (immutable cache) ---
    location /_next/static {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --- Public Assets ---
    location /Image {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location /textures {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location /brand {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # --- Favicon & robots ---
    location = /favicon.ico {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # --- Main Proxy ---
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSocket support (cho HMR dev, hoặc real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
