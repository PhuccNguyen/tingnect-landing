# ============================================
# YaaClub Landing — Docker Compose (Production)
# ============================================
# Dùng kết hợp với Nginx Proxy Manager đã có sẵn trên VPS.
# NPM trỏ domain → container này (port 3100).
#
# Deploy:
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Xem logs:
#   docker compose -f docker/docker-compose.yml logs -f
# ============================================

services:
  yaaclub-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: yaaclub-landing
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: yaaclub-network